                password: { type: string, description: "Auto-generated if empty" }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/reinstall:
    post:
      tags: [VM]
      summary: Reinstall VM OS
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [os_image]
              properties:
                os_image: { type: string }
                password: { type: string, description: "Auto-generated if empty" }
      responses:
        '200':
          description: Reinstall initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/remark:
    patch:
      tags: [VM]
      summary: Update VM Remark
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remark: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/tags:
    patch:
      tags: [VM]
      summary: Update VM Tags
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/push:
    post:
      tags: [VM]
      summary: Push (Transfer) VM to Another User
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient]
              properties:
                recipient: { type: string, description: "Recipient email or user UUID" }
      responses:
        '200':
          description: Transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/compensate:
    post:
      tags: [VM]
      summary: Compensate VM Days (Machine Owner / Admin)
      description: |
        Extends the VM's `expires_at` by `days` at the machine owner's expense.
        Cost = round2(price_monthly * days / 31), deducted from the owner's escrow balance
        (must not exceed `escrow_balance - escrow_locked_value`). Recorded as a `compensation` transaction.
        Only the owner of the VM's host machine (or an admin) may call this.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Compensated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CompensateResult' }
        '400':
          description: Invalid days or cost exceeds available escrow balance
        '401':
          description: Not the machine owner
        '404':
          description: VM not found

  /vms/{id}/block-user:
    post:
      tags: [VM]
      summary: Block VM Holder (Machine Owner / Admin)
      description: |
        Adds the current holder of this VM to the machine owner's blocklist. A blocked user can no longer
        purchase plans on, renew VMs on, buy second-hand VMs on, or be pushed VMs on **any** machine of this owner
        (those calls fail with code `13200`). Auto-renew is turned off on all of the user's VMs on the owner's machines;
        existing VMs keep running until they expire. The blocked user is notified (email/TG) with the reason.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: "Optional, shown to the blocked user" }
      responses:
        '200':
          description: Blocked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id: { type: string, format: uuid }
                          auto_renew_disabled_vms: { type: integer, format: int64 }
        '400':
          description: Already blocked, blocking yourself, or reason too long
        '403':
          description: Not the machine owner
        '404':
          description: VM not found

  # ---- Port Forwards ----

