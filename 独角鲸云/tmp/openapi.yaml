        '200':
          description: Listing created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarketListing' }

  /market/listings/{id}:
    get:
      tags: [Market]
      summary: Get Listing Detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarketListing' }
    delete:
      tags: [Market]
      summary: Cancel Listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /market/listings/{id}/buy:
    post:
      tags: [Market]
      summary: Buy Listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Purchased
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /market/my-listings:
    get:
      tags: [Market]
      summary: My Listings
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          listings: { type: array, items: { $ref: '#/components/schemas/MarketListing' } }
                          total: { type: integer }

  # ---- VMs ----

  /vms:
    get:
      tags: [VM]
      summary: List My VMs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, description: "Search by remark" }
        - name: sort_by
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vms: { type: array, items: { $ref: '#/components/schemas/VM' } }
                          total: { type: integer }
                          page: { type: integer }
    post:
      tags: [VM]
      summary: Purchase VM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, format: uuid }
                os_image: { type: string }
                auto_renew: { type: boolean, default: false }
                promo_code: { type: string }
                remark: { type: string }
                password: { type: string, description: "Root password; auto-generated if empty" }
                turnstile_token: { type: string }
      responses:
        '200':
          description: Purchased
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VM' }

  /vms/{id}:
    get:
      tags: [VM]
      summary: Get VM Details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VM' }
    delete:
      tags: [VM]
      summary: Destroy VM (with Refund)
      description: Destroys the VM and processes a partial refund based on remaining time.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Destroyed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/refund-preview:
    get:
      tags: [VM]
      summary: Preview Refund Amount
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refund_amount: { type: number }
                          days_remaining: { type: integer }

  /vms/{id}/renew:
    post:
      tags: [VM]
      summary: Renew VM
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
