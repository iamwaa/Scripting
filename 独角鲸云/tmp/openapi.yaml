                          vm: { $ref: '#/components/schemas/VM', nullable: true }

  /tickets/{id}/messages:
    post:
      tags: [Tickets]
      summary: Reply to Ticket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                attachments: { type: array, items: { type: string } }
      responses:
        '200':
          description: Message added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
