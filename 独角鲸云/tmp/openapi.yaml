openapi: 3.0.0
info:
  title: Narwhal Cloud V2.0 API
  description: |
    API documentation for the Narwhal Cloud V2.0 user-facing services.

    ### Authentication
    All authenticated endpoints require an `Authorization` header.
    We support two types of credentials:
    1. **JWT Token**: Obtained via `/auth/login`. Used for session-based access.
    2. **API Key**: Generated in the user profile. Used for programmatic access.

    **Usage**:
    Include the credential in the header as follows:
    `Authorization: Bearer <your_token_or_api_key>`

    The system automatically detects whether the value is an API Key or a JWT Token.

    *Note: Administrative endpoints are excluded from this documentation.*
  version: 2.0.0
servers:
  - url: https://api.fuckip.me/api/v1
    description: Production Server
  - url: /api/v1
    description: Relative path (for local development)

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Use "Bearer <token>" or "Bearer <api_key>" for authenticated requests.

  schemas:
    FeaturedTag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 32 }
        owner_id: { type: string, format: uuid }
        color: { type: string, description: "#rrggbb, empty = default style" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 0 for success, non-zero for errors.
          example: 0
        msg:
          type: string
          example: ok
        data:
          description: Business data (present on success).

    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        username: { type: string, description: "User-defined username; empty string if not set" }
        display_name: { type: string, description: "Public display name: username, or email local part (before @) if not set" }
        role: { type: string, enum: [user, admin] }
        available_balance: { type: number, description: "Withdrawable balance (USD)" }
        escrow_balance: { type: number, description: "Balance earned as machine owner (USD)" }
        escrow_locked_value: { type: number, description: "Locked part of escrow balance for active VMs (USD)" }
        commission_rate: { type: number, description: "Platform commission rate (0-1)" }
        notify_via: { type: string, enum: [email, tg] }
        notify_lang: { type: string, enum: [zh, en] }
        tg_chat_id: { type: integer }
        tg_bot_url: { type: string, description: "Bot link with binding token (valid 5 min)" }
        has_password: { type: boolean }
        is_banned: { type: boolean }
        payment_info:
          type: object
          properties:
            text: { type: string }
            image_url: { type: string }
        created_at: { type: integer, format: int64 }

    LoginResult:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        machine_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        cpu: { type: integer }
        ram_mb: { type: integer }
        disk_gb: { type: integer }
        bandwidth_mbps: { type: integer, description: "0 = unlimited" }
        monthly_traffic_gb: { type: integer, description: "0 = unlimited" }
        price_monthly: { type: number }
        max_quantity: { type: integer, description: "0 = unlimited (owner view only; zeroed in public views)" }
        sold_quantity: { type: integer, description: "Owner view only; zeroed in public views" }
        limit_per_user: { type: boolean, description: "One VM per user at a time" }
        allow_full_refund: { type: boolean }
        status: { type: string, enum: [active, hidden] }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    OSImage:
      type: object
      properties:
        id: { type: string, example: "debian-12-x64" }
        name: { type: string, example: "Debian 12 (x86_64)" }

    PublicPlan:
      description: Plan as shown in the public market, joined with its host machine's public metadata.
      allOf:
        - $ref: '#/components/schemas/Plan'
        - type: object
          properties:
            remaining: { type: integer, description: "Remaining stock; 0 when unlimited" }
            machine_name: { type: string }
            machine_region: { type: string }
            machine_status: { type: string, enum: [online, offline] }
            machine_tags: { type: array, items: { type: string } }
            machine_description: { type: string }
            machine_vm_type: { type: string, description: "podman | cloudhv" }
            machine_expires_at: { type: integer, format: int64, description: "0 = never" }
            machine_sla: { type: number, description: "30-day uptime percentage of the host machine (0-100, 1 decimal)" }
            machine_created_at: { type: integer, format: int64, description: "Host machine registration time; used to show listing age" }
            owner_name: { type: string, description: "Merchant display name: owner's username, or email local part (before @) if not set" }
            supported_os: { type: array, items: { $ref: '#/components/schemas/OSImage' } }
            sold_out: { type: boolean, description: "True when max_quantity reached or host RAM insufficient" }
            ram_insufficient: { type: boolean }

    PublicMachine:
      description: Public view of a single host machine plus its active plans.
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string }
        status: { type: string, enum: [online, offline] }
        tags: { type: array, items: { type: string } }
        description: { type: string }
        vm_type: { type: string, description: "podman | cloudhv" }
        owner_id: { type: string, format: uuid, description: "Machine owner (merchant) user ID" }
        owner_name: { type: string, description: "Merchant display name: owner's username, or email local part (before @) if not set" }
        expires_at: { type: integer, format: int64, description: "0 = never" }
        sla: { type: number, description: "30-day uptime percentage (0-100, 1 decimal)" }
        supported_os: { type: array, items: { $ref: '#/components/schemas/OSImage' } }
        plans: { type: array, items: { $ref: '#/components/schemas/PublicPlan' } }

    CompensateResult:
      type: object
      properties:
        vm_id: { type: string, format: uuid }
        compensate_days: { type: integer }
        cost: { type: number, description: "Deducted from the owner's escrow balance: round2(price_monthly * days / 31)" }
        new_expires_at: { type: integer, format: int64 }
        new_escrow_balance: { type: number }

    VM:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        machine_id: { type: string, format: uuid }
        remark: { type: string }
        status: { type: string, enum: [creating, running, stopped, starting, stopping, restarting, reinstalling, error] }
        type: { type: string, description: "Virtualization type: podman | cloudhv" }
        cpu: { type: integer }
        ram_mb: { type: integer }
        disk_gb: { type: integer }
        bandwidth_mbps: { type: integer }
        monthly_traffic_gb: { type: integer, description: "0 = unlimited" }
        price_monthly: { type: number, description: "Renewal price snapshot" }
        os_image: { type: string }
        os_name: { type: string }
        credentials:
          type: object
          description: Only returned to the VM owner / admin
          properties:
            username: { type: string }
            password: { type: string }
        ip: { type: string, description: "Internal IP" }
        ip_addresses: { type: array, items: { type: string } }
        cpu_pct: { type: number }
        ram_used_mb: { type: integer, format: int64 }
        traffic_in_bytes: { type: integer, format: int64 }
        traffic_out_bytes: { type: integer, format: int64 }
        monthly_traffic_in: { type: integer, format: int64 }
        monthly_traffic_out: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
        auto_renew: { type: boolean }
        tags: { type: array, items: { type: string } }
        listing_id: { type: string, format: uuid, nullable: true, description: "Set while listed on the second-hand market" }
        is_listed: { type: boolean }
        user_email: { type: string, description: "Buyer email; omitted in the machine owner's VM list (GET /machines/{machine_id}/vms)" }
        user_name: { type: string, description: "Buyer display name: username, or email local part (before @) if not set" }
        machine_name: { type: string }
        machine_region: { type: string }
        machine_entry_host: { type: string, description: "Host entry (IPv4 or DDNS)" }
        machine_entry_ipv6: { type: string }
        machine_os_images: { type: array, items: { $ref: '#/components/schemas/OSImage' } }
        machine_expires_at: { type: integer, format: int64, description: "0 = never; upper bound for renewals" }
        owner_id: { type: string, format: uuid, description: "Machine owner (merchant); only in GET /vms/{id}" }
        owner_name: { type: string, description: "Merchant display name (username, or email local part if not set); only in GET /vms/{id}" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    PortMapping:
      type: object
      properties:
        protocol: { type: string, enum: [tcp, udp] }
        host_port: { type: integer }
        guest_port: { type: integer }
        description: { type: string }

    Machine:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        region: { type: string, description: "2-letter ISO code, auto-detected from IP" }
        status: { type: string, enum: [online, offline] }
        vm_type: { type: string, description: "podman | cloudhv" }
        tags: { type: array, items: { type: string } }
        is_active: { type: boolean, description: "Admin listed/unlisted flag" }
        entry_host: { type: string, description: "Entry host (IPv4 or DDNS)" }
        entry_ipv6: { type: string }
        os_images: { type: array, items: { $ref: '#/components/schemas/OSImage' } }
        last_heartbeat: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64, description: "0 = never" }
        reported_specs:
          type: object
          description: Real-time specs/load reported by the agent heartbeat
          properties:
            cpus: { type: integer }
            ram_total_mb: { type: integer, format: int64 }
            disk_total_gb: { type: integer, format: int64 }
            bandwidth_mbps: { type: integer }
            cpu_usage_pct: { type: number }
            ram_used_mb: { type: integer, format: int64 }
            disk_used_gb: { type: integer, format: int64 }
            net_in_bps: { type: integer, format: int64 }
            net_out_bps: { type: integer, format: int64 }
            load1: { type: number }
            load5: { type: number }
            load15: { type: number }
            uptime: { type: integer, format: int64 }
        agent_token: { type: string, description: "Only returned on creation/rotation" }
        owner_email: { type: string, description: "List view only" }
        vm_count: { type: integer, description: "List view only" }
        plan_count: { type: integer, description: "List view only" }
        promo_count: { type: integer, description: "List view only" }
        est_revenue: { type: number, description: "List view only" }
        earned_revenue: { type: number, description: "Settled escrow income excluding refunds, compensation, and ongoing frozen value; list view only" }
        locked_value: { type: number, description: "Ongoing escrow locked value for running VMs; list view only" }
        sla: { type: number, description: "30-day uptime percentage (0-100, 1 decimal); list view only" }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, description: "purchase | escrow_in | renew | escrow_renew | refund | escrow_deduct | topup | market_sell | market_buy | withdrawal | ip_rent | ip_renew | compensation" }
        amount: { type: number }
        balance_type: { type: string, enum: [available, escrow] }
        balance_after: { type: number }
        note: { type: string }
        created_at: { type: integer, format: int64 }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        type: { type: string, description: "purchase | refund | renewal | push" }
        amount: { type: number }
        discount_amount: { type: number }
        promo_code: { type: string }
        created_at: { type: integer, format: int64 }

    PaymentRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        gateway: { type: string, enum: [stripe, hupijiao, cryptomus, creem] }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, paid, failed, expired] }
        pay_url: { type: string }
        created_at: { type: integer, format: int64 }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, enum: [support, withdrawal] }
        title: { type: string }
        status: { type: string, enum: [open, pending, resolved, closed] }
        machine_id: { type: string, format: uuid, nullable: true }
        vm_id: { type: string, format: uuid, nullable: true }
        user_role: { type: string, description: "Requester role: user | host" }
        created_at: { type: integer, format: int64 }
        closed_at: { type: integer, format: int64, nullable: true }

    TicketMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        sender_role: { type: string, enum: [user, host, admin] }
        content: { type: string }
        attachments: { type: array, items: { type: string } }
        created_at: { type: integer, format: int64 }

    WithdrawalRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, enum: [payout, transfer] }
        request_amount: { type: number }
        escrow_balance_snapshot: { type: number }
        locked_value: { type: number }
        available_to_withdraw: { type: number }
        commission_rate: { type: number }
        commission_amount: { type: number }
        payout_amount: { type: number }
        status: { type: string, enum: [pending, approved, rejected] }
        admin_note: { type: string }
        created_at: { type: integer, format: int64 }
        processed_at: { type: integer, format: int64, nullable: true }

    WithdrawalInfo:
      type: object
      properties:
        escrow_balance: { type: number }
        locked_value: { type: number }
        available_to_withdraw: { type: number }
        commission_rate: { type: number }
        payment_info:
          type: object
          properties:
            text: { type: string }
            image_url: { type: string }
        has_pending_request: { type: boolean }

    MarketListing:
      type: object
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid }
        price: { type: number }
        status: { type: string, enum: [active, sold, cancelled] }
        cpu: { type: integer }
        ram_mb: { type: integer }
        disk_gb: { type: integer }
        bandwidth_mbps: { type: integer }
        region: { type: string }
        expires_at: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }

    PromoCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        machine_id: { type: string, format: uuid, nullable: true }
        code: { type: string }
        discount_percent: { type: number }
        max_uses: { type: integer, description: "0 = unlimited" }
        used_count: { type: integer }
        expires_at: { type: integer, format: int64, nullable: true }
        renew_same_price: { type: boolean }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: integer, format: int64 }

    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        type: { type: string, enum: [info, warning, danger] }
        created_at: { type: integer, format: int64 }

    SpeedTestResult:
      type: object
      properties:
        protocol: { type: string, enum: [icmp, tcp, http] }
        target: { type: string }
        node_id: { type: string, description: "Requested node ID (empty for country_codes requests)" }
        probe_country: { type: string }
        probe_city: { type: string }
        probe_asn: { type: integer }
        probe_network: { type: string }
        success: { type: boolean }
        is_up: { type: boolean }
        min_rtt: { type: number }
        avg_rtt: { type: number }
        max_rtt: { type: number }
        packet_loss: { type: number }
        total_time: { type: number }
        error: { type: string }
        timestamp: { type: integer, format: int64 }

    ChatMessage:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string, format: uuid }
        nickname: { type: string, description: "Display name (username, or email prefix if not set) for normal users; empty string for admin/owner" }
        tag: { type: string, enum: ["admin", "owner", ""], description: "Special role tag" }
        content: { type: string }
        at: { type: integer, format: int64, description: "Unix timestamp in seconds" }

    IPGateway:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        region: { type: string }
        hostname: { type: string }
        port: { type: integer }
        status: { type: string, enum: [online, offline] }
        verify_tls: { type: boolean }
        note: { type: string }
        created_at: { type: integer, format: int64 }

    IPPool:
      type: object
      properties:
        id: { type: string, format: uuid }
        gateway_id: { type: string, format: uuid }
        name: { type: string }
        wg_interface: { type: string }
        ip_type: { type: string, enum: [ipv4, ipv6] }
        pool_definition: { type: string }
        reserved_definition: { type: string }
        min_alloc_prefix: { type: integer }
        gateway_wg_public_key: { type: string }
        connect_host: { type: string }
        connect_port: { type: integer }
        price_monthly: { type: number }
        total_units: { type: integer }
        used_units: { type: integer }
        is_active: { type: boolean }
        created_at: { type: integer, format: int64 }

    IPResource:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        ip_pool_id: { type: string, format: uuid }
        vm_id: { type: string, format: uuid, nullable: true }
        allocated_ip: { type: string }
        allocated_prefix: { type: integer }
        wg_client_address: { type: string }
        wg_client_private_key: { type: string, description: "WireGuard private key for this resource" }
        wg_client_public_key: { type: string }
        status: { type: string, enum: [active, expired] }
        expires_at: { type: integer, format: int64 }
        auto_renew: { type: boolean }
        price_monthly: { type: number }
        remark: { type: string }
        created_at: { type: integer, format: int64 }

tags:
  - name: Authentication
  - name: User
  - name: API Key
  - name: VM
  - name: Port Forwards
  - name: Market
  - name: Billing
  - name: Payment
  - name: Machines
  - name: Machine Chat
  - name: Plans
  - name: Promo Codes
  - name: Tickets
  - name: Withdrawals
  - name: IP Resources
  - name: Announcements
  - name: Misc

paths:
  # ---- Authentication ----

  /auth/login:
    post:
      tags: [Authentication]
      summary: Email Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request Password Reset Email
      description: |
        Sends a reset link (valid 30 minutes, single use) to the registered email.
        Always returns 200 regardless of whether the email exists, to prevent user enumeration.
        No email is sent if the account reset its password within the last 7 days.
        Rate limited to 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset Password With Token
      description: |
        Sets a new password using the token from the reset email, and revokes all existing sessions.
        A password can only be reset once every 7 days (429 otherwise). Rate limited to 10/min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400':
          description: Invalid or expired token, or password too short
        '429':
          description: Already reset within the last 7 days

  /auth/oauth/{provider}/login:
    post:
      tags: [Authentication]
      summary: OAuth Login (GitHub / Google)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [github, google] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string }
                redirect_uri: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }

  # ---- User ----

  /user/me:
    get:
      tags: [User]
      summary: Get Current User Profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserResponse' }

  /user/me/username:
    patch:
      tags: [User]
      summary: Update Username
      description: |
        Set the public display name shown to other users (merchant name, chat nickname, etc.).
        Pass an empty string to clear it and fall back to the email local part (before @).

        Rules: 2-20 characters; letters (any language), digits, `_`, `-`, `.` only.
        Uniqueness is case-insensitive and also checked against other users' current display names
        (email local part for users without a username). Rate limited to 10 per minute.

        Chat messages store the nickname at send time; history is not renamed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 0, maxLength: 20, example: "narwhal_01" }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          display_name: { type: string, description: "Display name after the update" }
        '400':
          description: Invalid username format, or username already taken (code `11102`)
        '429':
          description: Too many requests

  /user/me/notify:
    patch:
      tags: [User]
      summary: Update Notification Settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notify_via: { type: string, enum: [email, tg] }
                notify_lang: { type: string, enum: [zh, en] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /user/me/test-notify:
    post:
      tags: [User]
      summary: Send Test Notification
      description: Rate limited to 10 per minute.
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /user/me/payment-info:
    patch:
      tags: [User]
      summary: Update Payment Text Info
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /user/blocked-merchants:
    get:
      tags: [User]
      summary: List My Blocked Merchants
      description: Merchants (machine owners) the current user has blocked. Not paginated (max 200 entries).
      responses:
        '200':
          description: Blocked merchants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            user_id: { type: string, format: uuid }
                            merchant_id: { type: string, format: uuid }
                            merchant_name: { type: string, description: "Merchant display name: merchant's username, or email local part (before @) if not set" }
                            reason: { type: string, description: "Private note, only visible to the current user" }
                            created_at: { type: integer, format: int64 }
                            updated_at: { type: integer, format: int64 }

  /user/blocked-merchants/{merchant_id}:
    put:
      tags: [User]
      summary: Block Merchant
      description: >
        Adds the merchant to the current user's blocklist, or updates the note if already blocked.
        Purchasing any plan on the merchant's machines then fails with code `13201`.
        Existing instances are not affected and can still be renewed.
      parameters:
        - { name: merchant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Blocked
        '400':
          description: Cannot block yourself / note too long / blocklist full
        '404':
          description: Merchant not found (user owns no machines)
    delete:
      tags: [User]
      summary: Unblock Merchant
      parameters:
        - { name: merchant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Unblocked
        '404':
          description: Merchant is not in your blocklist

  /user/featured-tags:
    get:
      tags: [User]
      summary: List My Featured Tags
      description: >
        Featured (highlighted) tags an admin has assigned to the current user. Only the assigned owner may
        put a featured tag on their machines; saving a machine with someone else's featured tag fails with 400.
      responses:
        '200':
          description: Featured tags owned by the current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/FeaturedTag' } }

  /user/featured-tags/{id}/color:
    patch:
      tags: [User]
      summary: Set Featured Tag Color
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                color: { type: string, example: '#ff6600', description: "#rrggbb; empty string restores the default gradient style" }
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid color format
        '403':
          description: Tag is not owned by the current user
        '404':
          description: Tag not found

  /user/me/payment-qr:
    post:
      tags: [User]
      summary: Upload Payment QR Code
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { url: { type: string } } }

  /user/me/tg-bind/start:
    post:
      tags: [User]
      summary: Start Telegram Binding
      description: Returns a Telegram Bot link with a temporary binding token (valid 10 min).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UserResponse' }

  /user/me/tg-bind:
    delete:
      tags: [User]
      summary: Unbind Telegram
      responses:
        '200':
          description: Unbound
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /user/password:
    post:
      tags: [User]
      summary: Set / Change Password
      description: Existing tokens are invalidated after password change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ---- API Key ----

  /user/apikey:
    get:
      tags: [API Key]
      summary: Get Current API Key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: string, description: "Plaintext API key (rnm_...)" }
    post:
      tags: [API Key]
      summary: Generate / Rotate API Key
      description: Old key is invalidated immediately.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: string }
    delete:
      tags: [API Key]
      summary: Delete API Key
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ---- Announcements ----

  /features:
    get:
      tags: [Platform]
      summary: Feature Switches
      description: 返回平台功能开关（由 config.yaml 的 platform 节控制）。
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          market_enabled: { type: boolean }
  /announcements:
    get:
      tags: [Announcements]
      summary: List Announcements
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          announcements: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
                          total: { type: integer }

  /featured-tags:
    get:
      tags: [Machines]
      summary: List Featured Tags
      description: All featured tags with their owner and color. Clients highlight machine tags that match a name exactly.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            color: { type: string, description: "#rrggbb, empty = default style" }
                            owner_id: { type: string, format: uuid }

  # ---- Machines (public) ----

  /machines/public:
    get:
      tags: [Machines]
      summary: List Public Machines
      description: Active machines for the 3D globe visualization. No auth required.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Machine' } }

  /machines/{id}/test-speed:
    post:
      tags: [Machines]
      summary: Test Machine Speed (ICMP Ping)
      description: Triggers a GlobalPing ICMP measurement from selected countries. Rate limited to 10/min. No auth required.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country_codes:
                  type: array
                  items: { type: string }
                  maxItems: 10
                  description: "ISO 3166-1 alpha-2 country codes"
                  example: ["US", "DE", "SG"]
                nodes:
                  type: array
                  items: { type: string }
                  description: "Precise node IDs from GET /speedtest/nodes (city / ISP level). Combined with country_codes, at most 10 probes."
                  example: ["hk", "jp-tokyo", "cn-telecom"]
      responses:
        '200':
          description: Speed test results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SpeedTestResult' } }

  /speedtest/nodes:
    get:
      tags: [Machines]
      summary: List Speed Test Nodes
      description: Returns the curated catalog of probe nodes (city / ISP level) usable in test-speed. No auth required.
      security: []
      responses:
        '200':
          description: Node catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            group: { type: string, enum: [cn_isp, asia, americas, europe, oceania] }
                            country: { type: string }
                            city: { type: string }
                            asn: { type: integer }
                            label: { type: string }
                            label_en: { type: string }

  # ---- Misc ----

  /tgbot/info:
    get:
      tags: [Misc]
      summary: Get Telegram Bot Info
      description: Returns the public bot URL. No auth required.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          bot_url: { type: string }

  /vms/{id}/console:
    get:
      tags: [VM]
      summary: VM Console (WebSocket TTY)
      description: |
        Upgrades the connection to a WebSocket for TTY access.
        **Auth**: Pass the bearer token as a query parameter `?token=<bearer>` (Authorization header is not supported during WS handshake).

        **Protocol**:
        - Binary frames → stdin to the VM
        - Text JSON `{"type":"resize","cols":80,"rows":24}` → terminal resize
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: cols
          in: query
          schema: { type: integer, default: 80 }
        - name: rows
          in: query
          schema: { type: integer, default: 24 }
      responses:
        '101':
          description: WebSocket upgrade successful

  # ---- Plans ----

  /plans:
    get:
      tags: [Plans]
      summary: List Public Market Plans
      description: |
        Active plans on online, listed, non-expired machines. No auth required (also served to SEO crawlers).
        Sold-out plans are still returned with `sold_out: true`. Not paginated. Rate limited to 10/min.
      security: []
      parameters:
        - name: machine_id
          in: query
          schema: { type: string, format: uuid }
          description: Only plans of this machine
        - name: region
          in: query
          schema: { type: string }
        - name: min_cpu
          in: query
          schema: { type: integer }
        - name: max_price
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [price_asc, price_desc] }
          description: Default is newest first; sold-out plans always sort last
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          plans: { type: array, items: { $ref: '#/components/schemas/PublicPlan' } }
                          total: { type: integer }

  /plans/{id}:
    get:
      tags: [Plans]
      summary: Get Plan Details
      description: Public plan detail with host machine metadata. No auth required. Returned even when sold out (see `sold_out`).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicPlan' }
        '404':
          description: Plan not found
    patch:
      tags: [Plans]
      summary: Update Plan (Owner / Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Partial plan fields to update (name, description, price_monthly, status, etc.)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Plan' }
    delete:
      tags: [Plans]
      summary: Delete Plan (Owner / Admin)
      description: Fails if the plan has active VMs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /machines/{id}/public:
    get:
      tags: [Machines]
      summary: Get Public Machine Details
      description: |
        Public metadata of a single host machine plus all of its active plans. No auth required.
        Returns 404 when the machine is offline, unlisted by admin, or expired.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicMachine' }
        '404':
          description: Machine not found / not publicly visible

  # ---- Promo Codes ----

  /promo-codes/preview:
    get:
      tags: [Promo Codes]
      summary: Preview Promo Code Discount
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: plan_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: amount
          in: query
          required: true
          schema: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          original_amount: { type: number }
                          discount_amount: { type: number }
                          final_amount: { type: number }
                          discount_percent: { type: number }
                          renew_same_price: { type: boolean }

  /promo-codes:
    post:
      tags: [Promo Codes]
      summary: Create Promo Code (Owner / Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, discount_percent]
              properties:
                machine_id: { type: string, format: uuid, description: "Null = platform-wide (admin only)" }
                code: { type: string }
                discount_percent: { type: number, minimum: 0, maximum: 100 }
                max_uses: { type: integer, description: "0 = unlimited" }
                expires_at: { type: integer, format: int64, description: "Unix timestamp; 0 = never" }
                renew_same_price: { type: boolean }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PromoCode' }

  /promo-codes/{id}/enable:
    put:
      tags: [Promo Codes]
      summary: Enable Promo Code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /promo-codes/{id}/disable:
    put:
      tags: [Promo Codes]
      summary: Disable Promo Code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /promo-codes/{id}:
    delete:
      tags: [Promo Codes]
      summary: Delete Promo Code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  # ---- Market ----

  /market/listings:
    get:
      tags: [Market]
      summary: List Active Market Listings
      parameters:
        - name: region
          in: query
          schema: { type: string }
        - name: min_cpu
          in: query
          schema: { type: integer }
        - name: max_price
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string, enum: [price_asc, price_desc] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
