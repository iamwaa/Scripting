  # ---- Tickets ----

  /tickets:
    get:
      tags: [Tickets]
      summary: List Tickets
      description: Users see their own tickets. Machine owners also see tickets related to their machines. Admins see all.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [support, withdrawal] }
        - name: status
          in: query
          schema: { type: string, enum: [open, pending, resolved, closed] }
        - name: machine_id
          in: query
          schema: { type: string, format: uuid }
        - name: vm_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tickets: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
                          total: { type: integer }
    post:
      tags: [Tickets]
      summary: Create Support Ticket
      description: Rate limited to 5 per 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
                attachments: { type: array, items: { type: string, description: "File URLs" } }
                machine_id: { type: string, format: uuid, nullable: true }
                vm_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Ticket' }

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get Ticket Detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ticket: { $ref: '#/components/schemas/Ticket' }
