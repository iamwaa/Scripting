      summary: Create Withdrawal Request
      description: Rate limited to 5 per 10 minutes. `amount=0` withdraws the full available balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, minimum: 0, description: "0 = withdraw all available" }
                type: { type: string, enum: [payout, transfer], description: "payout = external; transfer = to available balance (commission halved)" }
      responses:
        '200':
          description: Request created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
