              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/restart:
    post:
      tags: [VM]
      summary: Restart VM
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/reset-password:
    post:
      tags: [VM]
      summary: Reset VM Root Password
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
