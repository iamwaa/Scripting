  /billing/orders:
    get:
      tags: [Billing]
      summary: List Orders
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
        - name: type
