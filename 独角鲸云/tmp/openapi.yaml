              required: [auto_renew]
              properties:
                auto_renew: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/start:
    post:
      tags: [VM]
      summary: Start VM
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /vms/{id}/stop:
    post:
      tags: [VM]
      summary: Stop VM
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
