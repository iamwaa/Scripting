  # ---- Machine Chat ----

  /machines/{id}/chat:
    get:
      tags: [Machine Chat]
      summary: Machine Chat Room (WebSocket)
      description: |
        Upgrades the connection to a WebSocket for machine chat room.
        **Auth**: Pass token as query parameter `?token=<token_or_api_key>`.

        **Protocol**:
        - Send (text frame): `{"content":"hello"}`
        - Receive (text frame):
          - History on connect: `{"type":"history","data":[...ChatMessage]}`
          - Welcome frame: `{"type":"welcome","data":{"tag":"owner|admin|"}}`
          - New message: `{"type":"message","data":ChatMessage}`
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '101':
          description: WebSocket upgrade successful

  /machines/{id}/chat/call-owner:
    post:
      tags: [Machine Chat]
      summary: Call Machine Owner
      description: Sends a notification to the machine owner. Rate limited to 10/min. Each user can call once per machine.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

