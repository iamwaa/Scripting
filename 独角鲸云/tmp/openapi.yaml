                          total: { type: integer }

  # ---- Payment ----

  /payment/stripe/init:
    post:
      tags: [Payment]
      summary: Initialize Stripe Payment
      description: "Minimum $1. Amounts below $10 incur a $0.30 processing fee (charged on top, not credited to balance)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
                payment_method: { type: string, enum: [card, alipay], description: "Payment method; empty/card uses Stripe Dashboard defaults, alipay restricts to Alipay" }
                ips: { type: array, items: { type: string }, description: "Additional IPs for fraud check" }
                turnstile_token: { type: string }
      responses:
        '200':
          description: Stripe checkout session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment_record_id: { type: string, format: uuid }
                          checkout_url: { type: string }
                          fee_usd: { type: number, description: "Small-amount processing fee, 0 when amount >= $10" }
                          total_usd: { type: number, description: "Actual charge = amount + fee" }
                          expires_at: { type: integer, format: int64 }

  /payment/hupijiao/init:
    post:
      tags: [Payment]
      summary: Initialize HuPiJiao Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
                ips: { type: array, items: { type: string } }
                turnstile_token: { type: string }
      responses:
        '200':
          description: HuPiJiao payment URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { pay_url: { type: string } } }

  /payment/cryptomus/init:
    post:
      tags: [Payment]
      summary: Initialize Cryptomus Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 1 }
                ips: { type: array, items: { type: string } }
                turnstile_token: { type: string }
      responses:
        '200':
          description: Cryptomus invoice URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { pay_url: { type: string } } }

  /payment/records:
    get:
      tags: [Payment]
      summary: List Payment Records
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
        - name: gateway
          in: query
          schema: { type: string, enum: [stripe, hupijiao, cryptomus, creem] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records: { type: array, items: { $ref: '#/components/schemas/PaymentRecord' } }
                          total: { type: integer }

  /payment/records/{id}:
    get:
      tags: [Payment]
      summary: Get Payment Record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaymentRecord' }

  # ---- Machines (owner) ----

  /machines:
    get:
      tags: [Machines]
      summary: List My Machines
      description: Regular users see only their own machines. Admins can filter by `owner_id`.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [online, offline] }
        - name: region
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: sort_by
          in: query
          schema: { type: string }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          machines: { type: array, items: { $ref: '#/components/schemas/Machine' } }
                          total: { type: integer }
    post:
      tags: [Machines]
      summary: Register Machine
      description: Creates a new machine record. The authenticated user becomes the owner. Returns a one-time `agent_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                tags: { type: array, items: { type: string } }
                expires_at: { type: integer, format: int64, description: "Contract expiry Unix timestamp; 0 = never" }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Machine' }

  /machines/blocked-users:
    get:
      tags: [Machines]
      summary: List My Blocklist (Machine Owner)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Blocklist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer, format: int64 }
                          page: { type: integer }
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                owner_id: { type: string, format: uuid }
                                user_id: { type: string, format: uuid }
                                user_name: { type: string, description: "Blocked user's display name (username, or email local part if not set); email is not exposed" }
                                vm_id: { type: string, format: uuid, nullable: true, description: "VM that triggered the block" }
                                reason: { type: string }
                                created_at: { type: integer, format: int64 }

  /machines/blocked-users/{user_id}:
    delete:
      tags: [Machines]
      summary: Unblock User (Machine Owner)
      description: Removes the user from the blocklist. Auto-renew that was turned off at block time is not restored.
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Unblocked
        '404':
          description: User is not in your blocklist

  /machines/{id}:
    get:
      tags: [Machines]
      summary: Get Machine Details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Machine' }
    patch:
      tags: [Machines]
      summary: Update Machine
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Partial machine fields (name, description, tags, expires_at, etc.)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Machine' }
    delete:
      tags: [Machines]
      summary: Delete Machine
      description: Fails if the machine has active VMs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted (or marked as retired)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { status: { type: string } } }

  /machines/{id}/rotate-token:
    post:
      tags: [Machines]
      summary: Rotate Agent Token
      description: Old token is immediately invalidated. New token is only returned once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { agent_token: { type: string } } }

  /machines/{id}/notify-buyers:
    post:
      tags: [Machines]
      summary: Notify Buyers
      description: |
        Sends a custom notification from the machine owner.
        - Without `user_id`: broadcast to every user with an active VM on this machine. Limit: 2 per 24h per machine.
        - With `user_id` and `vm_id`: send to that buyer for the specified VM. Limit: 10 per 24h per (machine, VM).
        - With `user_id` but without `vm_id`: send to that buyer. Legacy callers are limited per (machine, user).

        Admins bypass the limits and may target any machine. Also subject to the 10/min strict rate limit.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                user_id: { type: string, format: uuid, nullable: true, description: "Target a single buyer; omit to broadcast" }
                vm_id: { type: string, format: uuid, nullable: true, description: "Target a specific VM; used to isolate private-notification limits" }
                subject: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { notified: { type: integer, description: "Number of users notified" } } }
        '400':
          description: Target user not found or has no VM on this machine
        '429':
          description: Notification quota exceeded

  /machines/{machine_id}/vms:
    get:
      tags: [Machines]
      summary: List VMs on Machine (Owner view)
      parameters:
        - name: machine_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
